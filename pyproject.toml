[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "arxiv>=4.0.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
markers = [
    "real_auth: run without the signed-in test user (real token checks)",
]
